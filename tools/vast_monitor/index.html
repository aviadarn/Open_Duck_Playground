<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vast monitor</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#232a33; --fg:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; gap:18px; align-items:center; flex-wrap:wrap;
           padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:14px; margin:0 12px 0 0; font-weight:600; letter-spacing:.02em; }
  .pill { display:inline-flex; align-items:center; gap:6px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--bad); }
  #alarm { display:none; margin:0; padding:10px 16px; background:#4a1d1d;
           border-bottom:1px solid var(--bad); color:#ffdcd7; }
  #alarm.show { display:block; }
  .stats { display:flex; gap:22px; flex-wrap:wrap; padding:10px 16px;
           border-bottom:1px solid var(--line); }
  .stat b { display:block; font-size:17px; font-weight:600; }
  .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; padding:12px 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .card h2 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--dim);
             display:flex; justify-content:space-between; }
  .card h2 em { font-style:normal; color:var(--fg); }
  canvas { width:100%; height:110px; display:block; }
  #logwrap { padding:0 16px 16px; }
  #log { background:#0b0e13; border:1px solid var(--line); border-radius:6px;
         height:300px; overflow-y:auto; padding:10px 12px; white-space:pre-wrap;
         word-break:break-word; font-size:12px; color:#c9d1d9; }
  #log .step { color:var(--accent); }
  #log .err { color:var(--bad); }
</style>
</head>
<body>

<header>
  <h1>vast monitor</h1>
  <span class="pill"><i class="dot" id="d-metrics"></i>metrics</span>
  <span class="pill"><i class="dot" id="d-logs"></i>logs</span>
  <span class="pill" id="err" style="color:var(--bad)"></span>
</header>

<p id="alarm"></p>

<div class="stats">
  <div class="stat"><b id="s-evals">-</b><span>evals</span></div>
  <div class="stat"><b id="s-step">-</b><span>step</span></div>
  <div class="stat"><b id="s-reward">-</b><span>reward</span></div>
  <div class="stat"><b id="s-sps">-</b><span>steps / sec</span></div>
  <div class="stat"><b id="s-power">-</b><span>gpu power</span></div>
  <div class="stat"><b id="s-temp">-</b><span>gpu temp</span></div>
</div>

<div class="grid">
  <div class="card"><h2>GPU utilisation <em id="v-gpu">-</em></h2><canvas id="c-gpu"></canvas></div>
  <div class="card"><h2>VRAM <em id="v-vram">-</em></h2><canvas id="c-vram"></canvas></div>
  <div class="card"><h2>CPU <em id="v-cpu">-</em></h2><canvas id="c-cpu"></canvas></div>
  <div class="card"><h2>RAM <em id="v-ram">-</em></h2><canvas id="c-ram"></canvas></div>
  <div class="card"><h2>eval reward <em id="v-rew">-</em></h2><canvas id="c-reward"></canvas></div>
</div>

<div id="logwrap"><div id="log"></div></div>

<script>
const S = { samples: [], rewards: [] };
const MAX = 900;

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// Minimal line chart. Hand-rolled rather than pulling a chart library: this
// page is served from a local script and must work with no network at all.
function draw(id, series, opts) {
  const cv = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);

  const pad = 2;
  let lo = opts.min !== undefined ? opts.min : Math.min(...series);
  let hi = opts.max !== undefined ? opts.max : Math.max(...series);
  if (!isFinite(lo) || !isFinite(hi)) return;
  if (hi === lo) { hi = lo + 1; }

  // gridlines
  g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (let i = 0; i <= 2; i++) {
    const y = pad + (h - 2*pad) * i / 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  }
  if (series.length < 2) return;

  const x = i => (w * i) / (series.length - 1);
  const y = v => h - pad - (h - 2*pad) * (v - lo) / (hi - lo);

  // fill
  g.beginPath(); g.moveTo(x(0), h);
  series.forEach((v, i) => g.lineTo(x(i), y(v)));
  g.lineTo(x(series.length - 1), h); g.closePath();
  g.fillStyle = opts.fill || 'rgba(88,166,255,.12)'; g.fill();

  // line
  g.beginPath();
  series.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)));
  g.strokeStyle = opts.color || css('--accent'); g.lineWidth = 1.6; g.stroke();
}

function fmt(n, d=0){ return n === null || n === undefined || !isFinite(n) ? '-' : n.toFixed(d); }

function render() {
  const s = S.samples;
  if (s.length) {
    const last = s[s.length - 1];
    draw('c-gpu',  s.map(m=>m.gpu_util), {min:0, max:100, color:css('--ok'),  fill:'rgba(63,185,80,.12)'});
    draw('c-vram', s.map(m=>m.vram_used), {min:0, max:Math.max(1,last.vram_total)});
    draw('c-cpu',  s.map(m=>m.cpu_util), {min:0, max:100, color:css('--warn'), fill:'rgba(210,153,34,.12)'});
    draw('c-ram',  s.map(m=>m.ram_used), {min:0, max:Math.max(1,last.ram_total), color:'#a371f7', fill:'rgba(163,113,247,.12)'});
    document.getElementById('v-gpu').textContent  = fmt(last.gpu_util) + ' %';
    document.getElementById('v-vram').textContent = fmt(last.vram_used) + ' / ' + fmt(last.vram_total) + ' MiB';
    document.getElementById('v-cpu').textContent  = fmt(last.cpu_util,1) + ' %';
    document.getElementById('v-ram').textContent  = fmt(last.ram_used) + ' / ' + fmt(last.ram_total) + ' MiB';
    document.getElementById('s-power').textContent = fmt(last.power) + ' W';
    document.getElementById('s-temp').textContent  = fmt(last.gpu_temp) + ' °C';
  }
  if (S.rewards.length) {
    draw('c-reward', S.rewards.map(r=>r.reward), {color:'#f0883e', fill:'rgba(240,136,62,.12)'});
    document.getElementById('v-rew').textContent = fmt(S.rewards[S.rewards.length-1].reward, 1);
  }
}

function setStatus(st) {
  document.getElementById('d-metrics').className = 'dot ' + (st.metrics_connected ? 'on' : 'off');
  document.getElementById('d-logs').className    = 'dot ' + (st.logs_connected ? 'on' : 'off');
  document.getElementById('err').textContent     = st.metrics_error || st.logs_error || '';
  document.getElementById('s-evals').textContent  = st.evals ?? '-';
  document.getElementById('s-step').textContent   = st.last_step !== null && st.last_step !== undefined
      ? st.last_step.toLocaleString() : '-';
  document.getElementById('s-reward').textContent = fmt(st.last_reward, 1);
  document.getElementById('s-sps').textContent    = st.steps_per_second
      ? Math.round(st.steps_per_second).toLocaleString() : '-';

  const a = document.getElementById('alarm');
  if (st.cpu_fallback_alarm) {
    a.className = 'show';
    a.textContent = 'WARNING: training is running but the GPU holds almost no memory. '
      + 'This is what a silent CPU fallback looks like (e.g. jax "Unable to load cuPTI"). '
      + 'Check the log for CudaDevice vs CpuDevice — the job will keep running at roughly 1/60th speed.';
  } else {
    a.className = '';
  }
}

function addLog(line) {
  const el = document.getElementById('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  const d = document.createElement('div');
  if (/^STEP:/.test(line)) d.className = 'step';
  else if (/Traceback|Error|error:|FAILED|CpuDevice/.test(line)) d.className = 'err';
  d.textContent = line;
  el.appendChild(d);
  while (el.childElementCount > 400) el.removeChild(el.firstChild);
  if (atBottom) el.scrollTop = el.scrollHeight;   // don't yank the view if scrolled up
}

fetch('/snapshot').then(r => r.json()).then(d => {
  S.samples = d.samples; S.rewards = d.rewards;
  d.logs.forEach(addLog);
  setStatus(d.status); render();
});

const es = new EventSource('/events');
es.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'metric') {
    S.samples.push(msg.data);
    if (S.samples.length > MAX) S.samples.shift();
  } else if (msg.type === 'log') {
    addLog(msg.data);
    const m = /^STEP:\s+(\d+)\s+reward:\s+(-?[\d.]+)/.exec(msg.data);
    if (m) S.rewards.push({step:+m[1], reward:+m[2]});
  } else if (msg.type === 'status') {
    setStatus(msg.data);
  }
};
es.onerror = () => {
  document.getElementById('d-metrics').className = 'dot off';
  document.getElementById('d-logs').className = 'dot off';
};

setInterval(render, 500);
addEventListener('resize', render);
</script>
</body>
</html>
