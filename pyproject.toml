[project]
name = "Open_Duck_Playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "framesviewer>=1.0.2",
    # jax >=0.9 removed jax.device_put_replicated, still called by brax 0.14.2.
    #
    # On Linux we use the `cuda12-local` extra, which links against the CUDA
    # already present in the container image instead of pip-installing a private
    # copy. That drops 13 nvidia-* wheels (2.79 GB) and cuts the uv cache from
    # 11 GB to 3.8 GB. It REQUIRES an image that ships CUDA >= 12.6 with
    # cuDNN >= 9.8 and NCCL -- `nvidia/cuda:12.9.1-cudnn-runtime-ubuntu22.04`
    # is verified good (cuDNN 9.10.2, NCCL 2.27.3, nvrtc 12.9.86). On a plain
    # Linux box with no system CUDA this will fail at runtime; use the `cuda12`
    # extra there instead.
    #
    # Two pieces the runtime image does NOT ship, added back explicitly:
    #   nvidia-cuda-nvcc-cu12  (39 MB) -- provides ptxas, which jax needs to
    #                                     compile kernels; absent from the image
    #   nvidia-nvshmem-cu12   (220 MB) -- required by jax-cuda12-plugin
    #   nvidia-cuda-cupti-cu12 (10 MB) -- cuPTI; without it jax raises
    #                                     "Unable to load cuPTI" and silently
    #                                     falls back to CPU. Verified on a real
    #                                     GPU box: omitting this gives
    #                                     [CpuDevice(id=0)], not a hard error.
    "jax[cuda12-local]>=0.5.0,<0.9 ; sys_platform == 'linux'",
    "nvidia-cuda-nvcc-cu12>=12.6.85 ; sys_platform == 'linux'",
    "nvidia-nvshmem-cu12>=3.2.5 ; sys_platform == 'linux'",
    "nvidia-cuda-cupti-cu12>=12.1.105 ; sys_platform == 'linux'",
    "jax>=0.5.0,<0.9 ; sys_platform != 'linux'",
    "jaxlib>=0.5.0,<0.9",
    "jaxtyping>=0.2.38",
    "matplotlib>=3.10.0",
    "mediapy>=1.2.2",
    "onnxruntime>=1.20.1",
    # playground >=0.1.0 removed mujoco_playground._src.collision (geoms_colliding)
    "playground==0.0.5",
    "pygame>=2.6.1",
    "tensorflow>=2.18.0",
    "tf2onnx>=1.16.1",
]
[build-system]
requires = ["setuptools"]
[tool.setuptools]
packages = ["playground"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
